<style>
:root{--c:#2563eb;--a:#ffb020;--bg:color-mix(in srgb,var(--c) 6%,#f7f8fa);--ink:color-mix(in srgb,var(--c) 8%,#0f1419);--mu:color-mix(in srgb,var(--c) 10%,#5c6670);--ln:color-mix(in srgb,var(--c) 12%,#dde1e8);--w:#fff;--rd:#d9382c;--sh:0 8px 28px rgba(20,40,90,.13);--g:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 72%,#0b1233));--fs:15px;--tap:40px;--btn:48px;--gw:150px;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--c)}

*{box-sizing:border-box;margin:0}html,body{height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template:"h h" auto "n m" minmax(0,1fr)/84px 1fr;overflow:hidden}

.chip{padding:6px 16px;min-height:var(--tap);border-radius:99px;border:1px solid var(--ln);background:var(--w);white-space:nowrap;font-weight:600}.chip.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gw),1fr));gap:10px;overflow:auto;align-content:start;flex:1;padding:2px;overscroll-behavior:contain}
.it{background:var(--w);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:84px;overflow-wrap:anywhere}
.it span{color:var(--mu);font-size:.87em}.it .p{color:var(--c);font-weight:700;font-size:.93em}.it.in{border-color:var(--c)}

.q{display:flex;align-items:center;gap:6px}.q button{width:var(--tap);height:var(--tap);border:1px solid var(--ln);border-radius:10px;font-weight:700;font-size:1.1em}.q input{width:64px;height:var(--tap);text-align:center;padding:4px}.q [data-a=x]{margin-left:12px;color:var(--rd);border-color:var(--rd)}
.mu{color:var(--mu)}.tot{display:flex;justify-content:space-between;font-size:1.47em;font-weight:800;padding:10px 0}.tot span:last-child{color:var(--c)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.row button{white-space:nowrap;padding-left:8px;padding-right:8px}
.pri,.ghost,.dng{padding:11px 14px;min-height:var(--btn);border-radius:12px;border:1px solid var(--c);font-weight:700}.pri{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}.ghost{color:var(--c)}.dng{color:var(--rd);border-color:var(--rd)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}.card h3{margin-bottom:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.87em;color:var(--mu);margin-bottom:8px}label input,label select{color:var(--ink);margin-top:3px}
.req{color:var(--rd)}.hint{display:block;font-size:.8em;color:var(--mu);margin-top:3px;font-weight:400}.er{color:var(--rd);font-size:.87em;margin-top:6px}.er:empty{display:none}
.ck{display:flex;align-items:center;gap:8px;font-size:1em;color:var(--ink);padding:6px 0}.ck input{width:22px;height:22px;margin:0;flex:none}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st div{background:var(--bg);border-radius:12px;padding:10px;color:var(--mu);font-size:.87em}.st b{display:block;font-size:1.27em;color:var(--ink)}.st small{display:block;font-size:.8em}
input[type=color]{height:var(--btn);padding:4px 6px;cursor:pointer}.sw{width:32px;height:32px;border-radius:50%;margin:8px 8px 0 0;padding:0;border:2px solid var(--ln)}.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;min-height:var(--tap);border:1px solid var(--ln);border-radius:10px;font-weight:600}.seg .on{background:var(--g);color:#fff;border-color:transparent}
.tag{font-size:.8em;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mu);white-space:nowrap}.tag.o{background:#ffe9b8;color:#6b4300}.tag.r{background:#cdf3dc;color:#0b5a2e}
#mo{position:fixed;inset:0;background:rgba(8,12,24,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
#md{background:var(--w);border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:92dvh;overflow:auto}#md h3{margin-bottom:10px}
.pvb{max-height:60dvh;overflow:auto;text-align:center;background:var(--bg);border-radius:10px;padding:8px}.pvb img{width:100%;max-width:420px;display:block;margin:0 auto 10px;box-shadow:var(--sh);background:#fff}
.sk{height:300px;border-radius:12px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:#131a2b;color:#fff;padding:9px 16px;border-radius:99px;z-index:10;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}
#cbar,#bd{display:none}#rc{display:none}
u.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none;text-decoration:none}@keyframes rp{to{transform:scale(2.6);opacity:0}}
@media print{@page{size:A5;margin:8mm}html,body{height:auto}body>*:not(#rc){display:none!important}body{display:block;overflow:visible;background:#fff}#rc{display:block}#rc img{display:block;width:100%;height:auto;page-break-after:always;break-after:page}#rc img:last-child{page-break-after:auto;break-after:auto}}
@media(min-width:1200px){#v-order.on{grid-template-columns:1fr 420px}#grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) + 20px),1fr))}.v{padding:24px 32px}#v-order.on{padding:0}}
@media(max-width:1000px){#v-rep.on,#v-set.on{display:block}}
@media(max-width:820px){
body{grid-template:"h" auto "m" minmax(0,1fr) "n" auto/1fr}
nav{flex-direction:row;border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.tab{flex:1;padding:8px 2px}.tab b{font-size:1.35em}
header{padding:8px 14px}#v-order.on{grid-template-columns:1fr}#grid{padding-bottom:96px;grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) - 20px),1fr))}
.cartp{position:fixed;left:0;right:0;bottom:0;max-height:82dvh;border:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:7;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}.cartp.open{transform:none}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 8px;flex:none}.back{display:block;width:100%;margin-bottom:8px;flex:none}
body.co #bd{display:block;position:fixed;inset:0;background:rgba(8,12,24,.4);z-index:6}
#cbar.on{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--nh,72px) + 10px);background:var(--g);color:#fff;border-radius:16px;padding:15px 16px;align-items:center;gap:10px;font-weight:700;z-index:5;box-shadow:var(--sh)}body.co #cbar{display:none!important}
#cn{background:#fff;color:var(--c);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px}#cbar span:nth-child(2){margin-right:auto}}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>

<body>
<header><span class="logo">📋</span><span id="brand">Tên cửa hàng</span><a id="gox" href="https://congcubanhang.vercel.app/">🧾 Bán hàng</a><span id="off" hidden>Offline</span><button id="inst" hidden>⤓ Cài app</button></header>
<nav><button class="tab on" data-v="order"><b>🛒</b>Đặt hàng</button><button class="tab" data-v="prod"><b>📦</b>Hàng hoá</button><button class="tab" data-v="rep"><b>📊</b>Đơn đặt</button><button class="tab" data-v="set"><b>⚙️</b>Cài đặt</button></nav>
<main>
<section class="v on" id="v-order">
 <div class="pane"><div class="row" style="margin:0"><input id="q" type="search" placeholder="Tìm hàng…"><button class="ghost" id="adhoc" style="flex:none">＋ Hàng khác</button></div><div id="lastd" style="margin-top:8px"></div><div class="chips" id="chips"></div><div id="grid"></div></div>
 <div class="pane cartp" id="cartp"><div class="grab" id="grab"></div><button class="ghost back" id="back">← Chọn tiếp</button><h3 id="ctitle">Đơn đặt hàng</h3><div id="cart"></div>
  <label for="c_to" style="margin-top:8px">Gửi đến (tuỳ chọn)</label><input id="c_to" placeholder="VD: Vân Bao Bì" maxlength="80"><label for="c_nt" style="margin-top:8px">Ghi chú (tuỳ chọn)</label><input id="c_nt" placeholder="VD: giao sáng mai" maxlength="300">
  <div class="tot" id="trow" hidden><span>Tạm tính</span><span id="tt">0đ</span></div><span class="hint" id="thint" hidden>Chỉ tính hàng có giá nhập.</span>
  <div class="row"><button class="dng" id="c_clr">Xoá hết</button><button class="pri" id="c_ok" style="flex:1.6">Tạo phiếu</button></div></div>
</section>
<section class="v" id="v-prod"><div class="row" style="margin:0 0 10px"><input id="pq" type="search" placeholder="Tìm hàng hoá…"><button class="pri" style="flex:none" id="padd">+ Thêm</button></div><div class="card" id="plist"></div></section>
<section class="v" id="v-rep"><div class="card full"><div class="seg" id="rg"></div></div><div class="card full"><div class="st" id="stats"></div></div><div class="card"><h3>Đặt nhiều nhất</h3><div id="top"></div></div><div class="card"><h3>Giá nhập thay đổi</h3><div id="chg"></div></div><div class="card full"><h3>Đơn đặt</h3><div id="olist"></div></div></section>
<section class="v" id="v-set"><div class="card" id="cfgc"></div><div class="card" id="uic"></div><div class="card full" id="datac"></div></section>
</main>
<div id="bd"></div><button id="cbar"><span id="cn">0</span><span>Xem đơn đặt</span><b id="cb"></b></button><div id="mo" hidden><div id="md" role="dialog" aria-modal="true"></div></div><div id="toast"></div><div id="rc"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN'),qf=n=>(Math.round(n*100)/100).toLocaleString('vi-VN');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
const num=v=>{const raw=String(v??''),kk=/^\s*[\d.,]+\s*k\s*$/i.test(raw);let s=raw.replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s)*(kk?1000:1)};
const p2=n=>String(n).padStart(2,'0'),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},dm=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()},tm=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const DEF=()=>({cfg:{name:'',phone:'',addr:'',pre:'',color:'#2563eb',price:0,big:0,vib:1,footer:'Xin cảm ơn!'},products:[],orders:[],counter:0,lastBackup:0});
let S=DEF(),DBH=null,cart={},AD={},TO='',NT='',G='',Q='',R='today',EDIT='',OL=100,PV=null,MS=false,hs;
/* ---- lưu trữ: IndexedDB, toàn bộ dữ liệu nằm trên máy ---- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('dat-hang-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{DBH=await idb();const v=await new Promise(r=>{const q=DBH.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v)S=Object.assign(DEF(),v,{cfg:Object.assign(DEF().cfg,v.cfg)})}catch(e){DBH=null;toast('Trình duyệt không cho lưu dữ liệu — hãy sao lưu thường xuyên')}}
function save(){if(DBH)try{const t=DBH.transaction('kv','readwrite');t.objectStore('kv').put(S,'s');t.onerror=()=>toast('Không lưu được dữ liệu — máy có thể hết dung lượng')}catch(e){toast('Không lưu được dữ liệu')}}
const hap=k=>{if(S.cfg.vib&&navigator.vibrate)try{navigator.vibrate(k==='tap'?18:[30,40,30])}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(hs);hs=setTimeout(()=>t.classList.remove('on'),2400)}
function bad(id,eid,msg){const el=$('#'+id);el.classList.add('bad');$('#'+eid).textContent=msg;el.focus();el.addEventListener('input',()=>{el.classList.remove('bad');$('#'+eid).textContent=''},{once:true})}
/* ---- lớp phủ (cửa sổ, giỏ): nút Back của điện thoại đóng lớp trên cùng thay vì thoát app ---- */
const OV=[];let IGN=0;const mClose=()=>{$('#mo').hidden=true};
function ovOpen(c){if(OV.includes(c))return;OV.push(c);if(OV.length===1)history.pushState({ov:1},'')}
